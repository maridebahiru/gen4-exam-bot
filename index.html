<!doctype html><html lang="am"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:var(--tg-theme-bg-color,#fff);color:var(--tg-theme-text-color,#111);-webkit-user-select:none;user-select:none}
#w{padding:16px;max-width:640px;margin:auto;position:relative;z-index:1}
.b{display:block;width:100%;text-align:left;margin:8px 0;padding:14px;border:1px solid #8884;border-radius:10px;background:var(--tg-theme-secondary-bg-color,#f2f2f2);color:inherit;font-size:16px}
.go{background:var(--tg-theme-button-color,#2481cc);color:var(--tg-theme-button-text-color,#fff);text-align:center}
input{width:100%;box-sizing:border-box;padding:12px;font-size:16px;border-radius:10px;border:1px solid #8886}
#wm{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.07;font-size:18px;line-height:46px;overflow:hidden;transform:rotate(-20deg) scale(1.6);word-break:break-all}
.t{display:flex;justify-content:space-between;opacity:.8;font-size:14px}
</style></head><body><div id="wm"></div><div id="w"></div>
<script>
const tg=Telegram.WebApp,W=document.getElementById("w");tg.ready();tg.expand();
try{tg.enableClosingConfirmation();tg.disableVerticalSwipes()}catch(e){}
document.addEventListener("contextmenu",e=>e.preventDefault());
let Q=[],L=[],k=0,end=0,run=false,hb,hid;
const post=(a,d)=>fetch("/api/"+a,{method:"POST",body:JSON.stringify({initData:tg.initData,...d})}).then(r=>r.json()).catch(()=>({}));
const msg=t=>{run=false;clearInterval(hb);W.innerHTML=`<h3>${t}</h3><button class="b go" onclick="tg.close()">ዝጋ</button>`};
function idScreen(m){W.innerHTML=`<h3>🎓 የተማሪ መለያ ቁጥር</h3><p>በ EJAT- ይጀምራል (ለምሳሌ፡ EJAT-001/2/...)</p>${m?`<p style="color:#c33">${m}</p>`:""}<input id=i placeholder="EJAT-001/2/..."><button class="b go" style="margin-top:12px" onclick="start()">🚀 ፈተና ጀምር</button>`}
async function start(){const v=document.getElementById("i").value;const r=await post("start",{student_id:v});
 if(r.state=="badid")return idScreen("መለያ ቁጥሩ ትክክል አይደለም");if(r.state=="takenid")return idScreen("ይህ መለያ ቁጥር ቀድሞ ጥቅም ላይ ውሏል");
 if(r.state!="run")return msg("ፈተናው ተዘግቷል ወይም አስቀድመው ወስደዋል።");
 Q=r.questions;L=r.letters;end=Date.now()+r.left*1000;run=true;
 document.getElementById("wm").textContent=(r.sid+" ").repeat(600);
 hb=setInterval(async()=>{const x=await post("ping",{});if(x.state=="closed")msg("ፈተናው ተጠናቀቀ።")},5000);show()}
function show(){if(k>=Q.length){post("finish",{reason:"done"});return msg("✅ ፈተናውን ጨርሰዋል።")}
 const q=Q[k];W.innerHTML=`<div class=t><span>ጥያቄ ${k+1}/${Q.length}</span><span id=tm></span></div><h3>${q.q}</h3>`+
 q.o.map((o,c)=>`<button class=b onclick="ans(${c})">${L[c]}. ${o}</button>`).join("");tick()}
async function ans(c){if(!run)return;const i=Q[k].i;k++;show();const r=await post("answer",{i,c});if(r.state=="closed")msg("ፈተናው ተጠናቀቀ።")}
function tick(){const e=document.getElementById("tm");if(!e)return;const s=Math.max(0,Math.round((end-Date.now())/1000));e.textContent="⏱ "+Math.floor(s/60)+":"+String(s%60).padStart(2,"0");if(s<=0&&run){msg("⏰ ሰዓቱ አልቋል")}}
setInterval(tick,1000);
function away(){if(!run)return;hid=setTimeout(()=>{if(run){navigator.sendBeacon("/api/finish",JSON.stringify({initData:tg.initData,reason:"left"}));msg("⛔ ፈተናው ተዘግቷል")}},6000)}
function back(){clearTimeout(hid)}
document.addEventListener("visibilitychange",()=>document.hidden?away():back());
try{tg.onEvent("deactivated",away);tg.onEvent("activated",back)}catch(e){}
if(!tg.initData)msg("ይህን ገጽ ከቴሌግራም ቦት ይክፈቱ።");else idScreen();
</script></body></html>
